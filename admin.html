<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración</title>
<style>
:root{--bg:#f6f5f2;--fg:#1c1b1a;--mut:#77726b;--bd:#e4e0da;--card:#fff;--ac:#1c1b1a}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--fg:#f2efe9;--mut:#9a948b;--bd:#2f2d2a;--card:#1d1c1a;--ac:#f2efe9}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0}
nav button,.btn{padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on,.btn.p{background:var(--ac);color:var(--bg)}main{padding:14px;max-width:1100px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card b{display:block;font-size:22px;margin-top:4px}.card span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px;display:block;overflow-x:auto}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-size:12px;text-transform:uppercase}
input,select{padding:9px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--card);color:var(--fg);max-width:100%}.f{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:end}.f label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
h3{margin:22px 0 6px}.bar{height:10px;background:var(--ac);border-radius:5px;opacity:.8}.err{color:#c0392b}.sub{color:var(--mut)}
</style></head><body><nav id="nav"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date()),money=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const PAYS=['efectivo','transferencia','debito','credito','mercadopago','otro'],STATES=['reservado','confirmado','en_espera','atendido','cancelado','no_asistio'];
let T=sessionStorage.t||'',tab='agenda',BZ,R={from:today(),to:today()};
async function A(p,body){const o={headers:{'X-Admin-Token':T,'Content-Type':'application/json'}};if(body){o.method='POST';o.body=JSON.stringify(body)}const r=await fetch('/api/admin/'+p,o);if(r.status==401){T='';sessionStorage.t='';login();throw new Error('auth')}const j=(r.headers.get('content-type')||'').includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(j.error);return j}
const val=id=>document.getElementById(id).value,opts=(a,sel)=>a.map(([v,l])=>`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(l)}</option>`).join('');
async function act(fn){try{await fn()}catch(e){if(e.message!='auth')alert(e.message)}}
const TABS={agenda:'Agenda',nuevo:'+ Nuevo corte',bloqueos:'Bloqueos',caja:'Caja',inteligencia:'Inteligencia',clientes:'Clientes',config:'Configuración'};
function login(){$('#nav').innerHTML='';$('#m').innerHTML='<h3>Administración</h3><div class="f"><input id="pw" type="password" placeholder="Clave"><button class="btn p" onclick="T=val(\'pw\');sessionStorage.t=T;go(tab)">Entrar</button></div>'}
async function go(t){tab=t;$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
if(!T)return login();try{BZ=await A('business',{get:1});await VIEWS[t]()}catch(e){if(e.message!='auth')$('#m').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
const tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length} class="sub">Sin datos</td></tr>`}</table>`;
const staffOpt=(all)=>(all?[['','Todos']]:[]).concat(BZ.staff.filter(s=>s.active).map(s=>[s.id,s.name]));
const rangeBar=()=>`<div class="f"><button class="btn" onclick="rg('d')">Hoy</button><button class="btn" onclick="rg('w')">Semana</button><button class="btn" onclick="rg('m')">Mes</button><label>Desde<input type="date" id="rf" value="${R.from}"></label><label>Hasta<input type="date" id="rt" value="${R.to}"></label><button class="btn p" onclick="R={from:val('rf'),to:val('rt')};go(tab)">Ver</button></div>`;
function rg(k){const d=new Date(),f=new Date(d);if(k=='w'){const w=(d.getDay()+6)%7;f.setDate(d.getDate()-w);d.setDate(f.getDate()+6)}if(k=='m'){f.setDate(1);d.setMonth(d.getMonth()+1,0)}R={from:iso(f),to:iso(d)};go(tab)}
const card=(l,v)=>`<div class="card"><span>${l}</span><b>${v}</b></div>`;
const bars=o=>{const m=Math.max(1,...Object.values(o));return tbl(['','Reservas',''],Object.entries(o).map(([k,v])=>[esc(k),v,`<div class="bar" style="width:${160*v/m}px"></div>`]))};
const VIEWS={
async agenda(){const F=window.F||(window.F={s:'',st:'',q:'',view:'lista'});const a=(await A(`agenda?from=${R.from}&to=${R.to}`)).filter(x=>(!F.s||x.staff_id==F.s)&&(!F.st||x.status==F.st)&&(!F.q||(x.client+x.phone).toLowerCase().includes(F.q.toLowerCase())));
$('#m').innerHTML=rangeBar()+`<div class="f"><label>Peluquero<select id="fs">${opts(staffOpt(1),F.s)}</select></label><label>Estado<select id="fe">${opts([['','Todos']].concat(STATES.map(s=>[s,s])),F.st)}</select></label><label>Cliente/teléfono<input id="fq" value="${esc(F.q)}"></label><button class="btn" onclick="F={s:val('fs'),st:val('fe'),q:val('fq')};go('agenda')">Filtrar</button></div>`+
tbl(['Fecha','Hora','Peluquero','Cliente','Teléfono','Servicio','Dur.','Precio','Estado'],a.map(x=>[x.date,x.start+'–'+x.end,esc(x.staff),esc(x.client),esc(x.phone),esc(x.service),(x.end_min-x.start_min)+'′',money(x.price),`<select onchange="setSt(${x.id},this.value)">${opts(STATES.map(s=>[s,s]),x.status)}</select>`]))},
async nuevo(){const sv=BZ.services.filter(s=>s.active);$('#m').innerHTML=`<h3>Registrar corte sin turno</h3><div class="f"><label>Peluquero<select id="ns">${opts(staffOpt())}</select></label><label>Servicio<select id="nv" onchange="document.getElementById('np').value=BZ.services.find(s=>s.id==this.value).price">${opts(sv.map(s=>[s.id,s.name]))}</select></label><label>Cliente<input id="nn"></label><label>Teléfono<input id="nt" inputmode="tel"></label><label>Precio cobrado<input id="np" type="number" value="${sv[0]?.price||0}"></label><label>Pago<select id="ny">${opts(PAYS.map(p=>[p,p]))}</select></label><label>Fecha<input id="nd" type="date" value="${today()}"></label><label>Hora<input id="nh" type="time" value="${new Date().toTimeString().slice(0,5)}"></label><button class="btn p" onclick="act(async()=>{await A('walkin',{staff_id:val('ns'),service_id:val('nv'),name:val('nn'),phone:val('nt'),price:val('np'),pay_method:val('ny'),date:val('nd'),start:val('nh')});alert('Registrado');go('agenda')})">Guardar</button></div>`},
async bloqueos(){const b=await A('blocks');$('#m').innerHTML=`<h3>Bloquear horario</h3><div class="f"><label>Peluquero<select id="bs">${opts([['','Todos']].concat(staffOpt()))}</select></label><label>Fecha<input type="date" id="bd" value="${today()}"></label><label>Desde<input type="time" id="b1" value="09:00"></label><label>Hasta<input type="time" id="b2" value="10:00"></label><label>Motivo<select id="br">${opts(['Vacaciones','Enfermedad','Trámite','Reunión','Mantenimiento','Llegó tarde','Otro'].map(x=>[x,x]))}</select></label><button class="btn p" onclick="act(async()=>{await A('block',{staff_id:val('bs'),date:val('bd'),start:val('b1'),end:val('b2'),reason:val('br')});go('bloqueos')})">Bloquear</button></div>`+
tbl(['Fecha','Desde','Hasta','Peluquero','Motivo',''],b.map(x=>[x.date,String(Math.floor(x.start_min/60)).padStart(2,'0')+':'+String(x.start_min%60).padStart(2,'0'),String(Math.floor(x.end_min/60)).padStart(2,'0')+':'+String(x.end_min%60).padStart(2,'0'),esc(x.staff||'Todos'),esc(x.reason),`<button class="btn" onclick="act(async()=>{await A('block_delete',{id:${x.id}});go('bloqueos')})">Quitar</button>`]))},
async caja(){const s=await A(`stats?from=${R.from}&to=${R.to}`),c=s.caja,r=s.rentabilidad;$('#m').innerHTML=rangeBar()+`<div class="cards">${card('Ingresos',money(c.ingresos))}${card('Con turno',money(c.ingresos_con_turno))}${card('Sin turno',money(c.ingresos_sin_turno))}${card('Egresos',money(c.egresos))}${card('Resultado neto',money(c.neto))}${card('Ganancia estimada / corte',r.ganancia_por_corte==null?'—':money(r.ganancia_por_corte))}</div>
<h3>Por forma de pago</h3>${tbl(['Medio','Total'],Object.entries(c.por_medio).map(([k,v])=>[k,money(v)]))}
<h3>Costos del período</h3>${tbl(['Fijos','Variables','Otros','Depreciación por corte'],[[money(r.fijos),money(r.variables),money(r.otros),money(r.depreciacion_por_corte)]])}
<h3>Cargar gasto</h3><div class="f"><label>Fecha<input type="date" id="ed" value="${today()}"></label><label>Tipo<select id="ek">${opts([['fijo','Costo fijo'],['variable','Costo variable'],['otro','Otro']])}</select></label><label>Categoría<input id="ec" placeholder="alquiler, insumos…"></label><label>Descripción<input id="ex"></label><label>Importe<input id="ea" type="number"></label><button class="btn p" onclick="act(async()=>{await A('expense',{date:val('ed'),kind:val('ek'),category:val('ec'),description:val('ex'),amount:val('ea')});go('caja')})">Guardar</button></div>
${tbl(['Fecha','Tipo','Categoría','Descripción','Importe'],c.gastos.map(e=>[e.date,e.kind,esc(e.category),esc(e.description),money(e.amount)]))}
<p><button class="btn" onclick="csv('gastos')">Exportar gastos CSV</button> <button class="btn" onclick="csv('turnos')">Exportar turnos/ventas CSV</button></p>`},
async inteligencia(){const s=await A(`stats?from=${R.from}&to=${R.to}`),k=s.kpi;$('#m').innerHTML=rangeBar()+`<div class="cards">${card('Cortes',k.cortes)}${card('Facturación',money(k.facturacion))}${card('Ticket promedio',money(k.ticket_promedio))}${card('Ocupación',k.ocupacion_pct+'%')}${card('Horas ociosas',k.horas_ociosas+' h')}${card('Clientes nuevos',k.clientes_nuevos)}${card('Recurrentes',k.clientes_recurrentes)}${card('Cancelaciones',k.cancelaciones+' ('+k.cancelaciones_pct+'%)')}${card('No asistió',k.no_asistio)}${card('Capacidad máx. (cortes)',k.capacidad_max_cortes)}${card('Capacidad usada',k.capacidad_usada_pct+'%')}${card('Potencial extra',money(k.potencial_facturacion_extra))}${card('Anticipación prom.',k.anticipacion_promedio_dias==null?'—':k.anticipacion_promedio_dias+' días')}</div>
<h3>Por peluquero</h3>${tbl(['Peluquero','Cortes','Facturación','Ticket','H. trab.','H. disp.','H. ociosas','Ocup.','♂','♀','Nuevos','Recurr.'],s.por_peluquero.map(p=>[esc(p.peluquero),p.cortes,money(p.facturacion),money(p.ticket),p.horas_trabajadas,p.horas_disponibles,p.horas_ociosas,p.ocupacion_pct+'%',p.hombres,p.mujeres,p.clientes_nuevos,p.clientes_recurrentes]))}
<h3>Demanda por horario</h3>${bars(s.demanda_por_hora)}<h3>Demanda por día</h3>${bars(s.demanda_por_dia)}
<h3>Clientes inactivos (+${BZ.inactive_days} días)</h3>${tbl(['Cliente','Teléfono','Última visita','Visitas'],s.clientes_inactivos.map(c=>[esc(c.name),esc(c.phone),c.ultima,c.visitas]))}`},
async clientes(){const c=await A('clients');$('#m').innerHTML=`<p><button class="btn" onclick="csv('clientes')">Exportar CSV</button></p>`+tbl(['Cliente','Teléfono','Visitas','Gastado','Primera','Última','Cada (días)','Peluquero hab.','Servicio hab.','Día hab.','Cancel.','Ausencias'],c.map(x=>[esc(x.nombre),esc(x.telefono),x.visitas,money(x.gastado),x.primera||'',x.ultima||'',x.frecuencia_dias??'',esc(x.peluquero_habitual||''),esc(x.servicio_habitual||''),esc(x.dia_habitual||''),x.cancelaciones,x.ausencias]))},
async config(){const b=BZ;$('#m').innerHTML=`<h3>Negocio</h3><div class="f"><label>Nombre<input id="cn" value="${esc(b.name)}"></label><label>Teléfono<input id="cp" value="${esc(b.phone)}"></label><label>Dirección<input id="ca" value="${esc(b.address)}"></label><label>Duración turno (min)<input id="cs" type="number" value="${b.slot_min}"></label><label>Inactivo tras (días)<input id="ci" type="number" value="${b.inactive_days}"></label><label>Recordatorios<select id="cr">${opts([[0,'Desactivados'],[1,'Activados']],b.reminders_on)}</select></label><button class="btn p" onclick="act(async()=>{await A('business',{name:val('cn'),phone:val('cp'),address:val('ca'),slot_min:val('cs'),inactive_days:val('ci'),reminders_on:+val('cr')});go('config')})">Guardar</button></div>
<h3>Peluqueros</h3>${tbl(['Nombre','Hace cabello femenino','Activo',''],b.staff.map(s=>[`<input id="sn${s.id}" value="${esc(s.name)}">`,`<select id="sf${s.id}">${opts([[0,'No'],[1,'Sí']],s.does_female)}</select>`,`<select id="sa${s.id}">${opts([[1,'Sí'],[0,'No']],s.active)}</select>`,`<button class="btn" onclick="act(async()=>{await A('staff',{id:${s.id},name:val('sn${s.id}'),does_female:+val('sf${s.id}'),active:+val('sa${s.id}')});go('config')})">Guardar</button>`]))}
<div class="f"><label>Nuevo peluquero<input id="nsn"></label><button class="btn" onclick="act(async()=>{await A('staff',{name:val('nsn')});go('config')})">Agregar</button></div>
<h3>Servicios</h3>${tbl(['Nombre','Precio','Duración (min)','Categoría','Activo',''],b.services.map(s=>[`<input id="vn${s.id}" value="${esc(s.name)}">`,`<input id="vp${s.id}" type="number" value="${s.price}">`,`<input id="vd${s.id}" type="number" value="${s.duration_min}">`,`<select id="vc${s.id}">${opts([['M','Hombre'],['F','Mujer'],['any','Ambos']],s.category)}</select>`,`<select id="va${s.id}">${opts([[1,'Sí'],[0,'No']],s.active)}</select>`,`<button class="btn" onclick="act(async()=>{await A('service',{id:${s.id},name:val('vn${s.id}'),price:val('vp${s.id}'),duration_min:val('vd${s.id}'),category:val('vc${s.id}'),active:+val('va${s.id}')});go('config')})">Guardar</button>`]))}
<div class="f"><label>Nombre<input id="xn"></label><label>Precio<input id="xp" type="number"></label><label>Min<input id="xd" type="number" value="30"></label><label>Categoría<select id="xc">${opts([['M','Hombre'],['F','Mujer'],['any','Ambos']])}</select></label><button class="btn" onclick="act(async()=>{await A('service',{name:val('xn'),price:val('xp'),duration_min:val('xd'),category:val('xc')});go('config')})">Agregar servicio</button></div>
<h3>Equipamiento (depreciación por corte)</h3>${tbl(['Equipo','Costo','Cortes estimados','Por corte'],b.equipment.map(e=>[esc(e.name),money(e.cost),e.est_cuts,money(e.cost/e.est_cuts)]))}
<div class="f"><label>Equipo<input id="qn"></label><label>Costo<input id="qc" type="number"></label><label>Fecha compra<input id="qf" type="date"></label><label>Cortes estimados<input id="qe" type="number"></label><button class="btn" onclick="act(async()=>{await A('equipment',{name:val('qn'),cost:val('qc'),buy_date:val('qf'),est_cuts:val('qe')});go('config')})">Agregar</button></div>`}};
function setSt(id,st){act(async()=>{let pm=null;if(st=='atendido'){pm=prompt('Forma de pago ('+PAYS.join(', ')+')','efectivo');if(!pm)return go('agenda')}await A('status',{id,status:st,pay_method:pm});go('agenda')})}
async function csv(n){const t=await A('csv?name='+n),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=n+'.csv';a.click()}
go('agenda')
</script></body></html>
